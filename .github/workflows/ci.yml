name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  generate-drift:
    name: generate drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make setup-tools
      - run: cd dashboard && npm ci
      - run: make generate
      - name: fail on uncommitted generated code
        run: git diff --exit-code

  api-lint:
    name: api lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: api
      - run: go install github.com/daveshanley/vacuum@v0.17.0
      - run: vacuum lint -r api/openapi/vacuum-ruleset.yaml -d api/openapi/openapi.yaml

  api-test:
    name: api test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: cd api && go test ./... -short -race

  api-integration:
    name: api integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: integration tests (testcontainers)
        run: cd api && go test ./... -race -run Integration
      - name: docker runtime tests (real daemon)
        run: cd api && go test -tags dockerint -race ./internal/runtime/...
      - name: migration up-down-up
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=osctf -e POSTGRES_USER=osctf -e POSTGRES_DB=osctf -p 5432:5432 postgres:17-alpine
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          for i in $(seq 1 30); do docker exec pg pg_isready -U osctf && break; sleep 1; done
          export DSN="postgres://osctf:osctf@localhost:5432/osctf?sslmode=disable"
          goose -dir api/internal/db/migrations postgres "$DSN" up
          goose -dir api/internal/db/migrations postgres "$DSN" down-to 0
          goose -dir api/internal/db/migrations postgres "$DSN" up

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: cd dashboard && npm ci
      - run: cd dashboard && npm run lint
      - run: cd dashboard && npm run typecheck
      - run: cd dashboard && npm test
      - run: cd dashboard && npm run build

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t osctf/platform:ci .

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v4
      - name: compose up
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: smoke test
        run: |
          set -a; source .env; set +a
          BASE_URL=http://localhost:8080 bash scripts/smoke.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs platform
      - name: teardown
        if: always()
        run: docker compose down -v

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: build per-team example image (for the instance e2e flow)
        run: docker build -t osctf/example-per-team-web:0.2 examples/challenges/per-team-web/src
      - name: compose up
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: playwright
        run: |
          cd dashboard && npm ci
          npx playwright install --with-deps chromium
          set -a; source ../.env; set +a
          BASE_URL=http://localhost:8080 npm run e2e
      - name: upload playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: dashboard/test-results
          retention-days: 7
      - name: platform logs on failure
        if: failure()
        run: docker compose logs platform | tail -100
      - name: teardown
        if: always()
        run: docker compose down -v
