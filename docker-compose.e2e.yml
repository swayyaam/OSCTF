# e2e overlay: build the platform image's `e2e` stage, which is the production image plus one
# stub auth plugin. Used by `make ci-e2e` so the browser suite can exercise the plugin surfaces
# against a genuinely loaded plugin rather than an empty list.
#
# Everything else — Postgres, Redis, MinIO, the challenge runtime — is the normal stack.
services:
  platform:
    build:
      context: .
      target: e2e
    # Set here, NOT left to the image's ENV: compose's env_file beats a Dockerfile ENV, so the
    # plugins directory .env.example configures would silently win and the stack would come up
    # with no plugins — which is exactly how this broke once, with the plugin specs failing on
    # main after passing on their own branch.
    environment:
      OSCTF_PLUGINS_ENABLED: "true"
      OSCTF_PLUGINS_DIR: /plugins
