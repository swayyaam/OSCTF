name: CI

# Every job runs a `make ci-<job>` target — the SAME target `make ci-local` runs locally, so a
# job cannot pass locally while running different commands here. `make ci-sync-check` (wired
# into ci-local) fails if a job added here is not also runnable locally. Job commands live in
# the Makefile / scripts, never inline, so there is one source of truth.
#
# Go setup is cached: go-version comes from go.mod (single source of truth) and the module +
# build cache is keyed on go.sum. The Go module lives at the repo root (its module path is
# github.com/osctf/platform, so `go get github.com/osctf/platform/...` resolves). This also warms
# the build cache the `setup-tools` installs (buf, golangci-lint, protoc-gen-*) reuse.

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  generate-drift:
    name: generate drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make setup-tools
      - run: cd dashboard && npm ci
      - run: make ci-generate-drift

  api-lint:
    name: api lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make setup-tools
      - run: make ci-api-lint

  api-test:
    name: api test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make ci-api-test

  api-integration:
    name: api integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # integration (testcontainers) + dockerint (real daemon, strict isolation) + 2-min soak
      # + migration up/down/up. See `ci-api-integration` in the Makefile.
      - run: make ci-api-integration

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make ci-web

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make ci-image

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v7
      - run: make ci-smoke
      - name: logs on failure
        if: failure()
        run: docker compose logs platform

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make ci-e2e
      - name: upload playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: dashboard/test-results
          retention-days: 7
