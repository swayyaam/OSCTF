# OSCTF golden-path deployment. `docker compose up -d --build` boots everything,
# migrates, seeds the admin + example challenges, and serves the SPA on :8080.
# Spec: docs/v0.1/10-deployment.md

services:
  platform:
    build: .
    image: ghcr.io/osctf/platform:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      # Root-equivalent on the host. Run events on a dedicated VM. See docs.
      - /var/run/docker.sock:/var/run/docker.sock
    # Grant the docker socket group so the non-root container can reach the daemon.
    group_add:
      - "${OSCTF_DOCKER_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-osctf}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-osctf}"
      POSTGRES_DB: "${POSTGRES_DB:-osctf}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osctf} -d ${POSTGRES_DB:-osctf}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-osctf-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-osctf-minio-secret}"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- optional: observability profile ---------------------------------------
  prometheus:
    image: prom/prometheus
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - platform

  grafana:
    image: grafana/grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # --- optional: TLS reverse proxy profile -----------------------------------
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OSCTF_DOMAIN: "${OSCTF_DOMAIN:-}"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - platform

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
